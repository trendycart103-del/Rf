name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then unzip -oq "$ZIP"; fi
      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts পাওয়া যায়নি, প্রজেক্টের ফাইল আপলোড হয়নি"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rf-receiver-apk
          path: out/app-debug.apk
